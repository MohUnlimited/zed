name: Zed Windows Build

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: Select build configuration
        required: true
        type: choice
        options:
          - debug
          - release
        default: debug

permissions:
  contents: read

concurrency:
  group: zed-rtl-windows-build
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 120

    env:
      BUILD_TYPE: ${{ inputs.build_type || 'debug' }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
          key: cargo-windows-${{ hashFiles('Cargo.lock') }}

      - name: Build Zed
        shell: pwsh
        run: |
          if ($env:BUILD_TYPE -eq "release") {
            cargo build --release
          }
          else {
            cargo build
          }

      - name: Set artifact path
        id: artifact
        shell: pwsh
        run: |
          if ($env:BUILD_TYPE -eq "release") {
            "path=target/release/zed.exe" >> $env:GITHUB_OUTPUT
          }
          else {
            "path=target/debug/zed.exe" >> $env:GITHUB_OUTPUT
          }

      - name: Upload Windows executable
        uses: actions/upload-artifact@v4
        with:
          name: zed-${{ env.BUILD_TYPE }}-windows
          path: ${{ steps.artifact.outputs.path }}
          if-no-files-found: error
          retention-days: 7
