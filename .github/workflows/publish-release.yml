name: Publish Tested Zed Build

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: "Run ID of the successful Build Zed for Windows workflow"
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish:
    name: Publish Existing Artifact
    runs-on: ubuntu-22.04

    steps:
      - name: Validate build run ID
        shell: bash
        env:
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
        run: |
          set -euo pipefail

          if [[ ! "$BUILD_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "Invalid build run ID."
            exit 1
          fi

      - name: Download artifact from selected build
        uses: actions/download-artifact@v4
        with:
          name: zed-windows-${{ inputs.build_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.build_run_id }}
          path: release-package

      - name: Read and validate build metadata
        id: metadata
        shell: bash
        run: |
          set -euo pipefail

          info="release-package/build-info.txt"

          if [[ ! -f "$info" ]]; then
            echo "Build metadata file not found."
            exit 1
          fi

          get_value() {
            local key="$1"
            local value

            value="$(sed -n "s/^${key}=//p" "$info" | head -n 1)"

            if [[ -z "$value" ]]; then
              echo "Missing metadata field: $key"
              exit 1
            fi

            printf '%s' "$value"
          }

          version="$(get_value version)"
          source_sha="$(get_value source_sha)"
          source_branch="$(get_value source_branch)"
          run_id="$(get_value run_id)"

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+([+-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid version in build metadata: $version"
            exit 1
          fi

          if [[ ! "$source_sha" =~ ^[0-9a-fA-F]{40,64}$ ]]; then
            echo "Invalid source commit SHA."
            exit 1
          fi

          if [[ ! "$run_id" =~ ^[0-9]+$ ]]; then
            echo "Invalid build run ID in metadata."
            exit 1
          fi

          if [[ "$run_id" != "${{ inputs.build_run_id }}" ]]; then
            echo "The artifact metadata does not match the selected build run."
            exit 1
          fi

          if [[ ! -f release-package/zed.exe ]]; then
            echo "zed.exe not found in the downloaded artifact."
            exit 1
          fi

          {
            echo "version=$version"
            echo "source_sha=$source_sha"
            echo "source_branch=$source_branch"
            echo "run_id=$run_id"
          } >> "$GITHUB_OUTPUT"

          echo "Version: $version"
          echo "Source branch: $source_branch"
          echo "Source commit: $source_sha"
          echo "Build run ID: $run_id"

      - name: Create ZIP archive
        shell: bash
        run: |
          set -euo pipefail

          cd release-package
          zip zed.zip zed.exe

          echo "ZIP contents:"
          unzip -l zed.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: rtl-v${{ steps.metadata.outputs.version }}
          target_commitish: ${{ steps.metadata.outputs.source_sha }}
          name: v${{ steps.metadata.outputs.version }}
          body: |
            Unofficial Windows build of Zed with RTL modifications.

            Version: v${{ steps.metadata.outputs.version }}
            Release channel: stable
            Source branch: ${{ steps.metadata.outputs.source_branch }}
            Source commit: ${{ steps.metadata.outputs.source_sha }}
            Build run ID: ${{ steps.metadata.outputs.run_id }}

            This release uses the existing tested artifact.
            No new build was performed during publishing.
            This is not an official Zed release.
          draft: false
          prerelease: false
          files: release-package/zed.zip
          fail_on_unmatched_files: true
